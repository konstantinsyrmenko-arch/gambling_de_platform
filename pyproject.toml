[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires the local PostgreSQL and ClickHouse services",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "airflow/dags", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
